<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--bg:#0c0d10;--panel:#14161b;--panel2:#1a1d23;--line:#292d36;--text:#f5f7fa;--muted:#9299a6;--accent:#6d8cff;--accent2:#5875e8;--good:#59d6ad;--warn:#f3bd63;--shadow:0 18px 50px #0007}
[data-theme=light]{color-scheme:light;--bg:#f4f5f7;--panel:#fff;--panel2:#f4f5f7;--line:#dedfe4;--text:#191b20;--muted:#6e737d;--accent:#4263dc;--accent2:#3452c2;--good:#168665;--warn:#9a6400;--shadow:0 18px 46px #25304b18}
@media(prefers-color-scheme:light){[data-theme=system]{color-scheme:light;--bg:#f4f5f7;--panel:#fff;--panel2:#f4f5f7;--line:#dedfe4;--text:#191b20;--muted:#6e737d;--accent:#4263dc;--accent2:#3452c2;--good:#168665;--warn:#9a6400;--shadow:0 18px 46px #25304b18}}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;max-width:1180px;margin:auto;padding:28px 34px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:28px}.identity{display:flex;align-items:center;gap:14px;min-width:0}.app-logo{width:54px;height:54px;border-radius:13px;object-fit:cover;flex:none}.brand h1{font:650 30px/1.1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.8px;margin:0}.brand p{margin:7px 0 0;color:var(--muted)}.status{display:flex;align-items:center;gap:7px;max-width:58%;padding:5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:8px;height:8px;margin:4px;border-radius:50%;background:var(--muted);flex:none;animation:statusPulse 2.4s ease-in-out infinite;will-change:transform,opacity}.status.connected .dot{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 15%,transparent)}.status.native .dot{background:var(--warn)}@keyframes statusPulse{0%,100%{opacity:.62;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.dot{animation:none;will-change:auto}}
.tabs{display:flex;gap:4px;margin:25px 0 17px;border-bottom:1px solid var(--line)}.tab{border:0;background:none;color:var(--muted);padding:11px 15px 13px;cursor:pointer;position:relative}.tab.about{margin-left:auto}.tab.active{color:var(--text)}.tab.active:after{content:"";height:2px;position:absolute;left:14px;right:14px;bottom:-1px;background:var(--accent);border-radius:2px}.page{min-height:0;overflow:auto;padding:2px 8px 26px 2px;scrollbar-color:var(--line) transparent}.page[hidden]{display:none}.mapping-controls{margin-bottom:12px}.mapping-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card{padding:16px}.card label,.field>label{display:block;font-weight:600;margin:0 0 9px}.section{padding:8px 18px;margin-bottom:13px}.section-title{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:13px 2px 7px}.row{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:30px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.copy{min-width:0}.copy strong{display:block;font-weight:600}.copy small{display:block;color:var(--muted);margin-top:3px;max-width:660px}.control{flex:none}.switch{position:relative;width:42px;height:24px}.switch input{opacity:0;position:absolute}.switch span{position:absolute;inset:0;border-radius:99px;background:#555b66;transition:.16s;cursor:pointer}.switch span:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:white;box-shadow:0 1px 3px #0005;transition:.16s}.switch input:checked+span{background:var(--accent)}.switch input:checked+span:after{transform:translateX(18px)}
select{min-width:190px;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 34px 0 11px;color:var(--text);background:var(--panel2);outline:none}select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.range{display:flex;align-items:center;gap:12px}.range input{accent-color:var(--accent);width:230px}.value{width:28px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 0}.btn{height:40px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--panel2);cursor:pointer;padding:0 16px}.btn:hover{border-color:color-mix(in srgb,var(--muted) 65%,var(--line));background:color-mix(in srgb,var(--panel2) 88%,var(--text))}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted)}.save{min-width:142px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}.save:hover{background:var(--accent2);border-color:var(--accent2)}@media(max-width:720px){.app{padding:22px}.status{max-width:45%}.row{gap:15px}.range input{width:150px}.actions{grid-template-columns:1fr}}
.css-editor{display:block;padding:14px 0}.css-editor textarea{display:block;width:100%;min-height:130px;margin-top:10px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);background:var(--panel2);font:13px/1.5 Consolas,"Cascadia Mono",monospace;outline:none}.css-editor textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.about-card{max-width:680px;margin:28px auto;padding:30px;text-align:center}.about-logo{width:88px;height:88px;border-radius:20px;object-fit:cover;margin-bottom:12px}.about-card h2{font-size:28px;margin:0 0 5px}.about-card .version{color:var(--muted);margin-bottom:20px}.about-card .developer{font-weight:600;font-size:16px}.about-links{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px 0}.about-links .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px}.brand-icon{width:18px;height:18px;display:block;fill:currentColor}.coffee-icon{color:#ffdd00}.copyright{color:var(--muted);font-size:13px;margin-top:24px}
</style>
</head>
<body><main class="app">
 <header class="top"><div class="identity"><img class="app-logo" src="__CAAM_LOGO__" alt=""><div class="brand"><h1>CaaM</h1><p>Controller as a Mouse</p></div></div><div id="status" class="status"><i class="dot"></i><span>Searching for controller…</span></div></header>
 <nav class="tabs"><button class="tab active" data-page="mapping">Button mapping</button><button class="tab" data-page="settings">Settings</button><button class="tab about" data-page="about">About</button></nav>
 <section id="mapping" class="page"><div id="mappingControls" class="mapping-controls"></div><div id="mappingGrid" class="mapping-grid"></div></section>
 <section id="settings" class="page" hidden><div id="settingsRoot"></div></section>
 <section id="about" class="page" hidden><div id="aboutRoot"></div></section>
 <footer class="footer"><span>Left stick moves · Right stick scrolls</span><button id="save" class="btn save">Save changes</button></footer>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.hidden=x.id!==b.dataset.page);document.querySelector('.footer').style.display=b.dataset.page==='about'?'none':'flex'});
function option(x,current){return `<option value="${esc(x.id)}" ${x.id===current?'selected':''}>${esc(x.label)}</option>`}
function render(s){state=s;document.documentElement.dataset.theme=(s.theme||'dark').toLowerCase();let custom=document.querySelector('#custom-theme-css')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'custom-theme-css'}));custom.textContent=s.customCss||'';$('.brand p').textContent=s.tagline;$('.tab[data-page=mapping]').textContent=s.mappingTitle;$('.tab[data-page=settings]').textContent=s.settingsTitle;$('.tab[data-page=about]').textContent=s.aboutTitle;$('.footer span').textContent=s.stickHelp;$('#save').textContent=s.save;
 const toggle=x=>`<div class="row"><div class="copy"><strong>${esc(x.label)}</strong>${x.help?`<small>${esc(x.help)}</small>`:''}</div><label class="switch control"><input type="checkbox" data-setting="${esc(x.key)}" ${x.value?'checked':''}><span></span></label></div>`;
 $('#mappingControls').innerHTML=`<div class="section">${toggle(s.swapSticks)}</div>`;
 $('#mappingGrid').innerHTML=s.mappings.map(m=>`<div class="card"><label>${esc(m.label)}</label><select data-binding="${esc(m.key)}">${s.actions.map(x=>option(x,m.action)).join('')}</select></div>`).join('');
 const select=x=>`<div class="row"><div class="copy"><strong>${esc(x.label)}</strong>${x.help?`<small>${esc(x.help)}</small>`:''}</div><select class="control" data-setting="${esc(x.key)}">${x.choices.map(v=>option(v,x.value)).join('')}</select></div>`;
 const range=x=>`<div class="row"><div class="copy"><strong>${esc(x.label)}</strong></div><div class="range control"><input type="range" min="1" max="100" value="${x.value}" data-setting="${esc(x.key)}"><span class="value">${x.value}</span></div></div>`;
 $('#settingsRoot').innerHTML=`<div class="section-title">${esc(s.behaviorGroup)}</div><div class="section">${s.toggles.map(toggle).join('')}</div><div class="section-title">${esc(s.interfaceGroup)}</div><div class="section">${s.selects.map(select).join('')}${s.sliders.map(range).join('')}<label class="css-editor"><span class="copy"><strong>${esc(s.customCssLabel)}</strong><small>${esc(s.customCssHelp)}</small></span><textarea data-setting="CustomCss" spellcheck="false" placeholder=".card { border-radius: 8px; }">${esc(s.customCss||'')}</textarea></label></div><div class="section-title">${esc(s.dataTools)}</div><div class="section"><div class="actions">${s.tools.map(x=>`<button class="btn" data-command="${x.command}">${esc(x.label)}</button>`).join('')}</div></div>`;
 $('#aboutRoot').innerHTML=`<div class="section about-card"><img class="about-logo" src="__CAAM_LOGO__" alt=""><h2>CaaM</h2><div class="version">${esc(s.versionLabel)} ${esc(s.version)}</div><div class="developer">Anton Jeremias Peters</div><div class="about-links"><button class="btn" data-url="https://github.com/antonjeremiaspeters"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.02c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.69-1.28-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.2 1.77 1.2 1.03 1.78 2.7 1.27 3.36.97.1-.75.4-1.27.74-1.56-2.57-.29-5.27-1.29-5.27-5.72 0-1.27.45-2.3 1.19-3.11-.12-.29-.52-1.47.11-3.07 0 0 .97-.31 3.16 1.19a10.94 10.94 0 0 1 5.76 0c2.2-1.5 3.16-1.19 3.16-1.19.63 1.6.23 2.78.11 3.07.74.81 1.19 1.84 1.19 3.11 0 4.44-2.71 5.42-5.29 5.71.42.36.79 1.07.79 2.16v3.21c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>GitHub</button><button class="btn" data-url="https://github.com/antonjeremiaspeters/caam"><svg class="brand-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75H4.5a1 1 0 0 0 0 2h8.75a.75.75 0 0 1 0 1.5H4.5A2.5 2.5 0 0 1 2 13.5V2.5Zm2.5-1A1 1 0 0 0 3.5 2.5v8.71c.31-.14.65-.21 1-.21h8V1.5h-8Z"/></svg>Repository</button><button class="btn" data-url="https://www.paypal.com/paypalme/antonjeremiaspeters"><svg class="brand-icon coffee-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.216 6.415l-.132-.666c-.119-.598-.388-1.163-1.001-1.379-.197-.069-.42-.098-.57-.241-.152-.143-.196-.366-.231-.572-.065-.378-.125-.756-.192-1.133-.057-.325-.102-.69-.25-.987-.195-.4-.597-.634-.996-.788-.2-.077-.409-.142-.626-.194-1-.263-2.05-.36-3.077-.416a25.834 25.834 0 0 0-3.7.062c-.915.083-1.88.184-2.75.5-.318.116-.646.256-.888.501-.297.302-.393.77-.177 1.146.154.267.415.456.692.58.36.162.737.284 1.123.366 1.075.238 2.189.331 3.287.37 1.218.05 2.437.01 3.65-.118.299-.033.598-.073.896-.119.352-.054.578-.513.474-.834-.124-.383-.457-.531-.834-.473-.466.074-.96.108-1.382.146-1.177.08-2.358.082-3.536.006a22.228 22.228 0 0 1-1.157-.107c-.086-.01-.18-.025-.258-.036-.243-.036-.484-.08-.724-.13-.111-.027-.111-.185 0-.212.277-.06.557-.108.838-.147.131-.009.263-.032.394-.048a25.076 25.076 0 0 1 3.426-.12c.674.019 1.347.067 2.017.144l.228.031c.267.04.533.088.798.145.392.085.895.113 1.07.542.055.137.08.288.111.431l.319 1.484a.237.237 0 0 1-.199.284c-.037.006-.075.01-.112.015a36.704 36.704 0 0 1-4.743.295 37.059 37.059 0 0 1-4.699-.304c-.14-.017-.293-.042-.417-.06-.326-.048-.649-.108-.973-.161-.393-.065-.768-.032-1.123.161-.29.16-.527.404-.675.701-.154.316-.199.66-.267 1-.069.34-.176.707-.135 1.056.087.753.613 1.365 1.37 1.502a39.69 39.69 0 0 0 11.343.376.483.483 0 0 1 .535.53l-.071.697-1.018 9.907c-.041.41-.047.832-.125 1.237-.122.637-.553 1.028-1.182 1.171-.577.131-1.165.2-1.756.205-.656.004-1.31-.025-1.966-.022-.699.004-1.556-.06-2.095-.58-.475-.458-.54-1.174-.605-1.793l-.731-7.013-.322-3.094c-.037-.351-.286-.695-.678-.678-.336.015-.718.3-.678.679l.228 2.185.949 9.112c.147 1.344 1.174 2.068 2.446 2.272.742.12 1.503.144 2.257.156.966.016 1.942.053 2.892-.122 1.408-.258 2.465-1.198 2.616-2.657.34-3.332.683-6.663 1.024-9.995l.215-2.087a.484.484 0 0 1 .39-.426c.402-.078.787-.212 1.074-.518.455-.488.546-1.124.385-1.766Z"/></svg>Buy me a coffee</button></div><div class="copyright">© 2026 Anton Jeremias Peters. All rights reserved.</div></div>`;
 document.querySelectorAll('input[type=range]').forEach(x=>x.oninput=()=>x.nextElementSibling.textContent=x.value);document.querySelector('[data-setting=Theme]').onchange=e=>document.documentElement.dataset.theme=e.target.value.toLowerCase();document.querySelector('[data-setting=SwapSticks]').onchange=e=>send('swapSticks',{value:e.target.checked});document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>send(x.dataset.command));document.querySelectorAll('[data-url]').forEach(x=>x.onclick=()=>send('openUrl',{url:x.dataset.url}));updateStatus(s.status)}
function updateStatus(x){let el=$('#status');el.className='status '+(x.kind||'');el.querySelector('span').textContent=x.text}
function send(type,data={}){chrome.webview.postMessage({type,...data})}
$('#save').onclick=()=>{let values={};document.querySelectorAll('[data-setting]').forEach(x=>values[x.dataset.setting]=x.type==='checkbox'?x.checked:x.type==='range'?Number(x.value):x.value);let bindings={};document.querySelectorAll('[data-binding]').forEach(x=>bindings[x.dataset.binding]=x.value);send('save',{values,bindings})};
chrome.webview.addEventListener('message',e=>{if(e.data.type==='state')render(e.data.state);if(e.data.type==='status')updateStatus(e.data);if(e.data.type==='saved'){let b=$('#save'),old=b.textContent;b.textContent=e.data.text;setTimeout(()=>b.textContent=old,1200)}});send('ready');
</script></body></html>
